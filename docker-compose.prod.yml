version: '3.8'

services:
  # Environnement de Production
  api-prod:
    build: .
    container_name: logistock-prod
    restart: unless-stopped
    ports:
      - "5000:5000"
    volumes:
      - ./data-prod:/app/data
    networks:
      - logistock-network

  # Collecteur de metriques
  prometheus:
    image: prom/prometheus:latest
    container_name: supervision-prometheus
    restart: unless-stopped
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    # Volontairement aucun port expose sur l'hote (securite)
    networks:
      - logistock-network

  # Interface visuelle des tableaux de bord
  grafana:
    image: grafana/grafana:latest
    container_name: supervision-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      - prometheus
    networks:
      - logistock-network

  # Sondage HTTP externe (probe_success pour alerte API DOWN)
  blackbox-exporter:
    image: prom/blackbox-exporter:latest
    container_name: supervision-blackbox
    restart: unless-stopped
    volumes:
      - ./blackbox.yml:/etc/blackbox_exporter/config.yml
    networks:
      - logistock-network

  # Exportateur de metriques systeme (CPU, RAM, disque)
  node-exporter:
    image: prom/node-exporter:latest
    container_name: supervision-node-exporter
    restart: unless-stopped
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    networks:
      - logistock-network

networks:
  logistock-network:
    name: logistock-network
    driver: bridge

volumes:
  prometheus-data:
  grafana-data:
