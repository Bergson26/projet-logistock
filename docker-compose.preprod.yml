version: '3.8'

# Environnement de pre-production isole
# - Volume separe : data-preprod (aucune donnee de production)
# - Port separe : 8080 (prod = 5000)
# - Reseau partage en lecture seule avec prod pour que Prometheus puisse scraper

services:
  api-preprod:
    build: .
    container_name: logistock-preprod
    restart: unless-stopped
    ports:
      - "8080:5000"
    volumes:
      - ./data-preprod:/app/data
    networks:
      - logistock-network

networks:
  logistock-network:
    external: true
    name: logistock-network
